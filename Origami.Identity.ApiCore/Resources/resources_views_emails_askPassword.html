<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restauración de contraseña - gpFleet</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f4f4; padding:20px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="background-color:#ffffff; border:1px solid #e0e0e0; border-radius:4px;">
                    <!-- Logo -->
                    <tr>
                        <td align="center" style="padding:30px 20px; border-bottom:1px solid #e0e0e0;">
                            <img src="https://lalademosite.azurewebsites.net/assets/img/logo-gpfleet.svg" alt="gpFleet" style="max-width:220px; height:auto; display:block;">
                        </td>
                    </tr>

                    <!-- Título -->
                    <tr>
                        <td align="center" style="padding:30px 20px 10px 20px;">
                            <h1 style="margin:0; font-family: Arial, Helvetica, sans-serif; font-size:28px; color:#000000; font-weight:bold;">Restauración de contraseña</h1>
                        </td>
                    </tr>

                    <!-- Cuerpo -->
                    <tr>
                        <td align="center" style="padding:20px 40px 10px 40px; color:#333333; font-size:15px; line-height:1.6;">
                            <p style="margin:10px 0;">{0}</p>
                            <p style="margin:10px 0;">
                                A continuación te compartimos el siguiente código para tu proceso
                                de restauración de contraseña:
                            </p>
                        </td>
                    </tr>

                    <!-- Código -->
                    <tr>
                        <td align="center" style="padding:20px;">
                            <p style="margin:0; font-size:26px; color:#000000; letter-spacing:2px;">{1}</p>
                        </td>
                    </tr>

                    <!-- Botón -->
                    <tr>
                        <td align="center" style="padding:20px;">
                            <a href="{2}/auth/password-change"
                               style="display:inline-block;
                                      background-color:#F58220;
                                      color:#ffffff;
                                      text-decoration:none;
                                      padding:14px 36px;
                                      border-radius:6px;
                                      font-size:16px;
                                      font-weight:bold;
                                      letter-spacing:2px;">
                                Recuperar Contraseña
                            </a>
                        </td>
                    </tr>

                    <!-- Aviso -->
                    <tr>
                        <td align="center" style="padding:25px 40px 30px 40px; border-top:1px solid #e0e0e0; color:#666666; font-size:13px; line-height:1.5;">
                            *En caso de que el código no funcione, intenta generar uno nuevo o ponte en
                            contacto con soporte <a href="#" style="color:#F58220; text-decoration:none;">aquí</a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
